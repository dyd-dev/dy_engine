name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    name: Discovery / Functional Checkers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.changes.outputs.heavy }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: changes
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
        run: python -B .github/ci/ci.py changes --base "$CI_BEFORE" --revision "$CI_AFTER"
      - name: Check the checker behavior
        run: |
          python -B -m unittest discover -s .github/ci -p 'test_ci.py'
          python -B -m unittest discover -s .github/ci -p 'test_discovery.py'
          python -B -m unittest discover -s .github/ci -p 'test_external_contracts.py'
          python -B -m unittest discover -s .github/ci -p 'test_observe.py'

  build:
    name: ${{ matrix.platform }} ${{ matrix.api }} ${{ matrix.config }}
    needs: discovery
    if: needs.discovery.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Windows, os: windows-2022, api: vulkan, config: Debug}
          - {platform: Windows, os: windows-2022, api: vulkan, config: Release}
          - {platform: Ubuntu, os: ubuntu-24.04, api: vulkan, config: Debug}
          - {platform: Ubuntu, os: ubuntu-24.04, api: vulkan, config: Release}
          - {platform: Windows, os: windows-2022, api: d3d12, config: Debug}
          - {platform: Windows, os: windows-2022, api: d3d12, config: Release}
          - {platform: macOS, os: macos-15, api: metal, config: Debug}
          - {platform: macOS, os: macos-15, api: metal, config: Release}
          - {platform: Ubuntu, os: ubuntu-24.04, api: 'null', config: Release}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-ci
        with:
          api: ${{ matrix.api }}
          clang: 'false'
      - name: Build and verify discovered artifacts
        env:
          CI_API: ${{ matrix.api }}
          CI_CONFIG: ${{ matrix.config }}
        run: python -B .github/ci/ci.py run --phase build --api "$CI_API" --config "$CI_CONFIG" --build-dir build/ci-build
        shell: bash
      - name: Verify external consumer isolation
        if: matrix.api == 'null'
        run: python -B .github/ci/test_consumer.py --build-dir build/ci-consumer --dependencies build/ci-build/_deps
      - name: Verify native observation and failure handling
        if: runner.os == 'Linux' && matrix.api == 'vulkan' && matrix.config == 'Debug'
        env:
          DY_CI_OBSERVER_LIVE: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python -B -m unittest discover -s .github/ci -p 'test_observe.py'
      - name: Observe original examples and API fixtures on software Vulkan
        if: runner.os == 'Linux' && matrix.api == 'vulkan' && matrix.config == 'Debug'
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python -B .github/ci/ci.py run --phase runtime --api vulkan --build-dir build/ci-build
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.platform }}-${{ matrix.api }}-${{ matrix.config }}
          path: |
            build/**/ci-logs
            build/**/ci-checks
            build/**/ci-manifest-*.json
            build/**/ci-programs-*.json
          retention-days: 7

  cpu:
    name: CPU Checks / ${{ matrix.os }}
    needs: discovery
    if: needs.discovery.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-ci
        with:
          api: 'null'
          clang: 'true'
      - name: Run boundary, functional and bounded fuzz checks
        run: python -B .github/ci/ci.py run --phase cpu --api null --build-dir build/ci-cpu --fuzz-seconds 3
      - name: Save diagnostics and replay inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-${{ matrix.os }}
          path: build/ci-cpu/ci-logs
          retention-days: 7

  runtime:
    name: Example Behavior / ${{ matrix.api }}
    needs: discovery
    # Never route code from a fork repository onto the project's physical GPU machines.
    if: needs.discovery.outputs.heavy == 'true' && github.repository == 'dyd-dev/dy_engine'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: vulkan, runner: dy-ci-windows-gpu}
          - {api: d3d12, runner: dy-ci-windows-gpu}
          - {api: metal, runner: dy-ci-macos-metal}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          api: ${{ matrix.api }}
          clang: 'false'
      - name: Observe official examples and verify public API output on a physical GPU
        env:
          CI_API: ${{ matrix.api }}
        run: python -B .github/ci/ci.py run --phase runtime --api "$CI_API" --build-dir build/ci-runtime
        shell: bash
      - name: Save execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.api }}
          path: build/ci-runtime/ci-logs
          retention-days: 7

  required:
    name: CI Required
    runs-on: ubuntu-24.04
    needs: [discovery, build, cpu, runtime]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require actual success from every necessary check
        env:
          DISCOVERY: ${{ needs.discovery.result }}
          HEAVY: ${{ needs.discovery.outputs.heavy }}
          BUILD: ${{ needs.build.result }}
          CPU: ${{ needs.cpu.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          test "$DISCOVERY" = success
          if [ "$HEAVY" = true ]; then
            test "$BUILD" = success
            test "$CPU" = success
            test "$RUNTIME" = success
          elif [ "$HEAVY" != false ]; then
            exit 1
          fi
