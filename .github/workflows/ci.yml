name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / ${{ matrix.platform }} / ${{ matrix.api }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, os: ubuntu-24.04, api: vulkan, config: Debug}
          - {platform: linux, os: ubuntu-24.04, api: vulkan, config: Release}
          - {platform: windows, os: windows-2022, api: vulkan, config: Debug}
          - {platform: windows, os: windows-2022, api: vulkan, config: Release}
          - {platform: windows, os: windows-2022, api: d3d12, config: Debug}
          - {platform: windows, os: windows-2022, api: d3d12, config: Release}
          - {platform: macos, os: macos-15, api: metal, config: Debug}
          - {platform: macos, os: macos-15, api: metal, config: Release}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-ci
        with:
          api: ${{ matrix.api }}
      - name: Build the examples application
        env:
          CI_PLATFORM: ${{ matrix.platform }}
          CI_API: ${{ matrix.api }}
          CI_CONFIG: ${{ matrix.config }}
        shell: bash
        run: python -B .github/ci/ci.py --platform "$CI_PLATFORM" --api "$CI_API" --phase build --config "$CI_CONFIG" --build-dir build/ci-build
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.platform }}-${{ matrix.api }}-${{ matrix.config }}
          path: build/ci-build/ci-logs/
          retention-days: 7

  mobile_build:
    name: Build / ${{ matrix.platform }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, os: ubuntu-24.04, config: Debug}
          - {platform: android, os: ubuntu-24.04, config: Release}
          - {platform: ios, os: xcode-27, config: Debug}
          - {platform: ios, os: xcode-27, config: Release}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the installed Android SDK
        if: matrix.platform == 'android'
        shell: bash
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-ci
        if: matrix.platform == 'ios'
        with:
          api: metal
      - name: Build the native mobile application
        env:
          CI_PLATFORM: ${{ matrix.platform }}
          CI_CONFIG: ${{ matrix.config }}
        shell: bash
        run: python -B .github/ci/ci.py --platform "$CI_PLATFORM" --phase build --config "$CI_CONFIG" --build-dir build/ci-mobile
      - name: Save application package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-${{ matrix.platform }}-${{ matrix.config }}
          path: build/ci-mobile/output/
          if-no-files-found: error
          retention-days: 7
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-build-logs-${{ matrix.platform }}-${{ matrix.config }}
          path: build/ci-mobile/ci-logs/
          retention-days: 7

  pages:
    name: Publish documentation
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mobile-application') && github.repository == 'dyd-dev/dy_engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment

