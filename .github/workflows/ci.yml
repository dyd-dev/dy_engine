name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    name: Discovery / Functional Checkers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.changes.outputs.heavy }}
      cpu: ${{ steps.changes.outputs.cpu }}
      runtime: ${{ steps.changes.outputs.runtime }}
      consumer: ${{ steps.changes.outputs.consumer }}
      selection: ${{ steps.changes.outputs.selection }}
      build_matrix: ${{ steps.changes.outputs.build_matrix }}
      runtime_matrix: ${{ steps.changes.outputs.runtime_matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Select checks from the pushed changes
        id: changes
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
        run: python -B .github/ci/ci.py changes --base "$CI_BEFORE" --revision "$CI_AFTER"
      - name: Check the checker behavior
        run: |
          python -B -m unittest discover -s .github/ci -p 'test_ci.py'
          python -B -m unittest discover -s .github/ci -p 'test_selection.py'
          python -B -m unittest discover -s .github/ci -p 'test_discovery.py'
          python -B -m unittest discover -s .github/ci -p 'test_external_contracts.py'
          python -B -m unittest discover -s .github/ci -p 'test_observe.py'

  build:
    name: ${{ matrix.platform }} ${{ matrix.api }} ${{ matrix.config }}
    needs: discovery
    if: needs.discovery.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discovery.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Read automatic push selection
        env:
          CI_SELECTION: ${{ needs.discovery.outputs.selection }}
        shell: bash
        run: python -c 'import os; from pathlib import Path; Path("ci-selection.json").write_text(os.environ["CI_SELECTION"], encoding="utf-8")'
      - uses: ./.github/actions/setup-ci
        with:
          api: ${{ matrix.api }}
          clang: 'false'
      - name: Build and verify discovered artifacts
        env:
          CI_API: ${{ matrix.api }}
          CI_CONFIG: ${{ matrix.config }}
        run: python -B .github/ci/ci.py run --phase build --api "$CI_API" --config "$CI_CONFIG" --build-dir build/ci-build --changes-file ci-selection.json
        shell: bash
      - name: Verify external consumer isolation
        if: matrix.api == 'null' && needs.discovery.outputs.consumer == 'true'
        run: python -B .github/ci/test_consumer.py --build-dir build/ci-consumer --dependencies build/ci-build/_deps
      - name: Verify profiling contracts on the Null backend
        if: matrix.api == 'null'
        env:
          CI_CONFIG: ${{ matrix.config }}
        shell: bash
        run: |
          cmake --build build/ci-build --config "$CI_CONFIG" --target ProfilerSamplerTests ProfilingTests RenderDocCaptureTests
          ctest --test-dir build/ci-build --build-config "$CI_CONFIG" --output-on-failure --no-tests=error -R '^(ProfilingSampler|ProfilingContracts|RenderDocAbsent|RenderDocInjected)$'
      - name: Verify native observation and failure handling
        if: runner.os == 'Linux' && matrix.api == 'vulkan' && matrix.config == 'Debug'
        env:
          DY_CI_OBSERVER_LIVE: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python -B -m unittest discover -s .github/ci -p 'test_observe.py'
      - name: Observe original examples and API fixtures on software Vulkan
        if: runner.os == 'Linux' && matrix.api == 'vulkan' && matrix.config == 'Debug'
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python -B .github/ci/ci.py run --phase runtime --api vulkan --build-dir build/ci-build --changes-file ci-selection.json
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.platform }}-${{ matrix.api }}-${{ matrix.config }}
          path: |
            build/**/ci-logs
            build/**/ci-checks
            build/**/ci-manifest-*.json
            build/**/ci-programs-*.json
          retention-days: 7

  cpu:
    name: CPU Checks / ${{ matrix.os }}
    needs: discovery
    if: needs.discovery.outputs.cpu == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Read automatic push selection
        env:
          CI_SELECTION: ${{ needs.discovery.outputs.selection }}
        shell: bash
        run: python -c 'import os; from pathlib import Path; Path("ci-selection.json").write_text(os.environ["CI_SELECTION"], encoding="utf-8")'
      - uses: ./.github/actions/setup-ci
        with:
          api: 'null'
          clang: ${{ runner.os != 'Windows' }}
      - name: Run boundary, functional and bounded fuzz checks
        run: python -B .github/ci/ci.py run --phase cpu --api null --build-dir build/ci-cpu --changes-file ci-selection.json --fuzz-seconds 3
      - name: Save diagnostics and replay inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-${{ matrix.os }}
          path: build/ci-cpu/ci-logs
          retention-days: 7

  runtime:
    name: Example Behavior / ${{ matrix.api }}
    needs: discovery
    # Never route code from a fork repository onto the project's physical GPU machines.
    if: needs.discovery.outputs.runtime == 'true' && github.repository == 'dyd-dev/dy_engine'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discovery.outputs.runtime_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Read automatic push selection
        env:
          CI_SELECTION: ${{ needs.discovery.outputs.selection }}
        shell: bash
        run: python -c 'import os; from pathlib import Path; Path("ci-selection.json").write_text(os.environ["CI_SELECTION"], encoding="utf-8")'
      - uses: ./.github/actions/setup-ci
        with:
          api: ${{ matrix.api }}
          clang: 'false'
      - name: Observe official examples and verify public API output on a physical GPU
        env:
          CI_API: ${{ matrix.api }}
        run: python -B .github/ci/ci.py run --phase runtime --api "$CI_API" --build-dir build/ci-runtime --changes-file ci-selection.json
        shell: bash
      - name: Save execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.api }}
          path: build/ci-runtime/ci-logs
          retention-days: 7

  required:
    name: CI Required
    runs-on: ubuntu-24.04
    needs: [discovery, build, cpu, runtime]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require actual success from every necessary check
        env:
          DISCOVERY: ${{ needs.discovery.result }}
          HEAVY: ${{ needs.discovery.outputs.heavy }}
          EXPECT_CPU: ${{ needs.discovery.outputs.cpu }}
          EXPECT_RUNTIME: ${{ needs.discovery.outputs.runtime }}
          BUILD: ${{ needs.build.result }}
          CPU: ${{ needs.cpu.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          test "$DISCOVERY" = success
          if [ "$HEAVY" = true ]; then
            test "$BUILD" = success
            if [ "$EXPECT_CPU" = true ]; then test "$CPU" = success; else test "$CPU" = skipped; fi
            if [ "$EXPECT_RUNTIME" = true ]; then test "$RUNTIME" = success; else test "$RUNTIME" = skipped; fi
          elif [ "$HEAVY" != false ]; then
            exit 1
          fi
