<title id="title">dy_framework 구성도 — 왼쪽에서 오른쪽으로 진행하는 배치</title>
<desc id="desc">개발자 C++ 코드는 데이터 처리와 RenderGraph를 거치거나 RHI를 직접 제어한다. 두 경로는 공통 RHI를 통해 Vulkan, Direct3D 12, Metal로 연결된다. 수학, SIMD, ThreadPool, 플랫폼, 계측은 공통 기반이다.</desc>
