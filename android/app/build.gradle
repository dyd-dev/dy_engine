plugins {
    id 'com.android.application'
}

def cmakeArguments = project.properties.findAll { key, value ->
    key.startsWith('DY_')
}.collect { key, value -> "-D${key}=${value}".toString() }

android {
    namespace 'com.dyengine.app'
    compileSdk 34
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId "com.dyengine.app"
        minSdk 34
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DDY_BUILD_EXAMPLES=OFF"
                arguments(*cmakeArguments)
                targets 'dy_engine_app'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/examples-assets').get().asFile
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

// Native targets stage each entry's assets before the APK asset merger reads them.
tasks.configureEach { task ->
    if(task.name == 'mergeDebugAssets' || task.name == 'mergeReleaseAssets') {
        def variant = task.name.substring(5, task.name.length() - 6)
        task.dependsOn "externalNativeBuild${variant}"
    }
}
